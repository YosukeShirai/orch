[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orch"
version = "0.1.0"
description = "Goal-driven task orchestrator powered by Claude Code"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "aiosqlite>=0.19.0",
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
orch = "orch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
